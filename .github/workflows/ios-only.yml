name: ios

# Manual-only lane: verifies that the iOS platform layer compiles on top of the
# upstream UI, then repacks the unsigned .app into an IPA.
on:
  workflow_dispatch:
    inputs:
      verbose:
        description: 'Verbose build output'
        required: false
        default: 'true'

env:
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.1'

jobs:
  ios:
    name: iOS unsigned
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Submodules over HTTPS
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1
          test -f plugins/prism_ui/pubspec.yaml
          test -f core/Clash.Meta/go.mod
          git submodule status --recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app 2>/dev/null \
            || sudo xcode-select -s /Applications/Xcode_26.2.app 2>/dev/null \
            || true
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Setup Rust
        run: |
          if ! command -v cargo >/dev/null; then
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          rustc --version
          cargo --version

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter pub get

      - name: Fetch CA certificates
        shell: bash
        env:
          CA_BUNDLE: cacert-2026-09-25.pem
          CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -

      - name: Build IPA
        env:
          # rquickjs generates its iOS bindings at build time; bindgen needs a
          # libclang and the Xcode toolchain copy is the one that matches the SDK.
          LIBCLANG_PATH: /Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/lib
        # --env stable is what removes the red PRE ribbon: APP_ENV defaults to
        # "pre" and AppEnvManager paints the channel name on the top-right
        # corner for anything that is not stable.
        run: dart setup.dart ios --no-codesign --env stable -v

      # TrollStore keeps whatever entitlements the binaries already carry, and
      # this build starts with none, so the tunnel would come up without
      # NetworkExtension rights. ldid writes them in before the IPA is packed.
      - name: Fakesign entitlements
        if: success()
        run: |
          if ! command -v ldid >/dev/null 2>&1; then
            brew install ldid
          fi
          chmod +x scripts/sign_ios.sh
          ./scripts/sign_ios.sh dist/FlClash.ipa

      - name: Verify entitlements
        if: success()
        run: |
          rm -rf /tmp/verify && mkdir -p /tmp/verify
          unzip -q dist/FlClash.ipa -d /tmp/verify
          app=/tmp/verify/Payload/Runner.app
          for bin in "$app/Runner" "$app/PlugIns/NECore.appex/NECore"; do
            echo "== $bin"
            /usr/bin/codesign -d --entitlements - --xml "$bin"
            /usr/bin/codesign -d --entitlements - --xml "$bin" 2>/dev/null \
              | grep -q packet-tunnel-provider
          done

      - name: Show output
        if: always()
        run: |
          ls -lh dist || true
          find build/ios -maxdepth 2 -name "*.app" -o -maxdepth 2 -name "*.a" 2>/dev/null | head

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifact-ios
          path: |
            dist
            build/ios/iphoneos/Runner.app
            core/dist
          overwrite: true
          if-no-files-found: warn
